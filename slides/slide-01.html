<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>NICE SO Story — Slide 01</title>
  <link rel="stylesheet" href="../styles/system.css">
  <style>
    .content { position: absolute; left: 72px; right: 72px; top: 225px; z-index: 2; }
    .brand-row { display: flex; align-items: center; }
    .headline { margin-top: 34px; max-width: 900px; font-size: 74px; }
    .sub { margin-top: 36px; padding-top: 31px; border-top: 1px solid var(--line); max-width: 870px; font-size: 29px; line-height: 1.42; color: #343945; }
    .sub strong { color: var(--ink); }
    .network { position: absolute; left: 40px; right: 40px; bottom: 114px; height: 335px; }
    .network svg { width: 100%; height: 100%; overflow: visible; }
    .network .route { fill: none; stroke: rgba(49,143,240,.62); stroke-width: 2.5; }
    .network .route.dashed { stroke: rgba(32,35,43,.34); stroke-dasharray: 5 8; }
    .network .node { fill: var(--amber); filter: drop-shadow(0 0 12px rgba(255,179,26,.95)); }
    .network .hub { fill: var(--primary); stroke: white; stroke-width: 2; filter: drop-shadow(0 0 16px rgba(49,143,240,.65)); }
    .network-label { position: absolute; right: 74px; top: 53px; padding: 15px 24px; border-radius: 999px; background: var(--primary); color: var(--white); font-size: 21px; font-weight: 900; box-shadow:0 14px 32px rgba(49,143,240,.22); }
    .network-label small { display: block; margin-top: 2px; font-size: 11px; font-weight: 500; text-align: center; }
    .swipe { position: absolute; left: 72px; bottom: 58px; display: flex; align-items: center; gap: 12px; color: rgba(32,35,43,.58); font-size: 15px; text-transform: uppercase; letter-spacing: .13em; }
    .swipe svg { width: 24px; height: 24px; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="glow red"></div><div class="glow amber"></div>
    <header class="topbar">
      <img class="gs-logo" src="../assets/gs-logo-colour.png" alt="Global Sources Indonesia">
    </header>

    <section class="content">
      <div class="brand-row">
        <div class="nice-logo-shell"><img class="nice-logo" src="../assets/niceso-logo.png" alt="NICE SO"></div>
      </div>
      <h1 class="headline"><span class="red">Dikira brand impor Korea,</span><br>ternyata milik lokal!</h1>
      <p class="sub">Rahasia raksasa retail Indonesia yang <strong>diam-diam tembus 200+ gerai</strong> di kota kecil.</p>
    </section>

    <div class="network" aria-label="Ilustrasi jaringan gerai">
      <svg viewBox="0 0 1000 330" aria-hidden="true">
        <path class="route" d="M490 208 110 90M490 208 165 280M490 208 382 65M490 208 608 78M490 208 855 112M490 208 772 285"/>
        <path class="route dashed" d="M490 208 724 34"/>
        <circle class="node" cx="110" cy="90" r="7"/><circle class="node" cx="165" cy="280" r="7"/>
        <circle class="node" cx="382" cy="65" r="7"/><circle class="node" cx="608" cy="78" r="7"/>
        <circle class="node" cx="855" cy="112" r="7"/><circle class="node" cx="772" cy="285" r="7"/>
        <circle class="hub" cx="490" cy="208" r="11"/>
      </svg>
      <div class="network-label">200+ Gerai<small>tersebar & terus bertambah</small></div>
    </div>

    <div class="swipe">
      <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      Swipe ke kiri
    </div>
    <footer class="footer" style="justify-content:flex-end"><span>01 / 04</span></footer>
  </main>
</body>
</html>
