<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lily's Pearl — Photo-led 1998 option</title>
  <link rel="stylesheet" href="../../../slides/campaign.css">
  <link rel="stylesheet" href="option.css">
</head>
<body>
  <main class="slide photo-led-origin">
    <div class="corner-shape corner-shape--top" aria-hidden="true"></div>
    <div class="corner-shape corner-shape--bottom" aria-hidden="true"></div>

    <header class="option-brandbar">
      <img
        class="option-local-icons-logo"
        src="../../../assets/local-icons-lockup-horizontal.svg"
        alt="Local Icons"
      >
    </header>

    <section class="origin-layout">
      <div class="origin-copy">
        <h1>You’ll see the <span>magic</span> if you keep believing.</h1>

        <p class="origin-analogy">
          Just as diamonds are shaped under pressure, pearls are formed around an irritant. Beauty can emerge from adversity.
        </p>

        <div class="origin-story">
          <div class="origin-year">1998</div>
          <p>
            Lily Purnama’s fascination with South Sea pearls began, paving the way for an enduring legacy of design, curation, and exploration.
          </p>
        </div>
      </div>

      <figure class="origin-photo">
        <img src="../../../assets/green-pendant-necklace.png" alt="Pearl necklace with a green pendant">
      </figure>
    </section>
  </main>
</body>
</html>
