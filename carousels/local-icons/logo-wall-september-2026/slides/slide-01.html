<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>Local Icons — Brand Wall</title>
  <link rel="stylesheet" href="campaign.css">
</head>
<body>
  <main class="canvas">
    <img class="corner-art corner-art--tl" src="../assets/ellips-6.png" alt="">
    <img class="corner-art corner-art--tr" src="../assets/ellips-5.png" alt="">
    <img class="corner-art corner-art--bl" src="../assets/ellips-3.png" alt="">
    <img class="corner-art corner-art--br" src="../assets/ellips-1.png" alt="">

    <div class="frame">
      <header>
        <img class="brand-logo" src="../assets/local-icons-lockup-horizontal.svg" alt="Local Icons, Indonesia Pavilions by Global Sources">
      </header>

      <h1 class="tagline">Where Local Becomes Iconic</h1>

      <section class="logo-wall" aria-label="Participating brands">
        <div class="brand-count" aria-label="52 plus brands">
          <span class="brand-count__number">52+</span>
          <span class="brand-count__label">Brands</span>
        </div>
        <div class="grid grid--vip">
          <div class="logo-card logo-card--vip"><img class="zoom-advance" src="../assets/advance-digital.jpg" alt="Advance Digitals"></div>
          <div class="logo-card logo-card--vip logo-card--color"><img src="../assets/bardi.png" alt="BARDI"></div>
          <div class="logo-card logo-card--vip"><img class="zoom-unitech" src="../assets/unitech.png" alt="Unitech"></div>
          <div class="logo-card logo-card--vip"><img src="../assets/hia.png" alt="HIA"></div>
          <div class="logo-card logo-card--vip"><img class="zoom-eiger" src="../assets/eigerindo.jpg" alt="Eigerindo"></div>
          <div class="logo-card logo-card--vip"><img class="zoom-youware" src="../assets/youware.jpg" alt="Youware"></div>
          <div class="logo-card logo-card--vip logo-card--placeholder" aria-label="Lumea temporary wordmark"><span class="temporary-wordmark temporary-wordmark--lumea">lumea</span></div>
          <div class="logo-card logo-card--vip"><img src="../assets/mediatech.jpg" alt="Mediatech"></div>
        </div>

        <div class="grid grid--non">
          <div class="logo-card logo-card--non"><img src="../assets/kin-ally.png" alt="Kin + Ally"></div>
          <div class="logo-card logo-card--non"><img class="zoom-gammara" src="../assets/gammara-leather.jpg" alt="Gammara Leather"></div>
          <div class="logo-card logo-card--non"><img class="zoom-hers" src="../assets/hers.jpeg" alt="Hers"></div>
          <div class="logo-card logo-card--non logo-card--color"><img src="../assets/kokocetak.png" alt="Kokocetak"></div>
          <div class="logo-card logo-card--non"><img src="../assets/lilys-pearl.png" alt="Lily's Pearl"></div>
          <div class="logo-card logo-card--non"><img src="../assets/tyeso.png" alt="TYESO"></div>
          <div class="logo-card logo-card--non"><img src="../assets/verona.jpeg" alt="Verona"></div>
          <div class="logo-card logo-card--non"><img class="zoom-yubi" src="../assets/yubi.jpg" alt="Yubi"></div>
          <div class="logo-card logo-card--non"><img class="zoom-visonda" src="../assets/visonda.jpeg" alt="Visonda"></div>
          <div class="logo-card logo-card--non"><img class="zoom-ymj" src="../assets/ymj.jpeg" alt="YMJ"></div>
        </div>
      </section>

      <footer class="event">
        <p class="date-pill">17–19 September 2026</p>
        <p class="hall">Hall B</p>
        <p class="venue">JICC Senayan, Jakarta</p>
      </footer>
    </div>
  </main>
</body>
</html>
