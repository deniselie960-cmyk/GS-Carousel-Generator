<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>FAQ Global Sources Indonesia — Cover Option 02</title>
  <link rel="stylesheet" href="../../../../shared/styles/system.css">
  <link rel="stylesheet" href="campaign.css">
  <style>
    .composition { --composition-gap: 44px; }
    .cover-panel {
      position: relative;
      width: 900px;
      min-height: 650px;
      margin: 0 auto;
      padding: 64px 64px 58px;
      overflow: hidden;
      border-radius: 52px;
      color: #fff;
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      box-shadow: 0 34px 74px rgba(25, 103, 184, .22);
      text-align: center;
    }
    .cover-panel::before {
      content: "?";
      position: absolute;
      right: -24px;
      top: -92px;
      color: rgba(255,255,255,.09);
      font-size: 410px;
      line-height: 1;
      font-weight: 900;
    }
    .cover-label {
      position: relative;
      display: inline-flex;
      padding: 12px 18px;
      border-radius: 999px;
      color: var(--ink);
      background: var(--amber);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .cover-title {
      position: relative;
      margin: 28px 0 0;
      font-size: 158px;
      line-height: .82;
      letter-spacing: -.07em;
    }
    .cover-title span { color: var(--amber); }
    .cover-subtitle {
      position: relative;
      margin: 32px auto 0;
      max-width: 690px;
      font-size: 36px;
      line-height: 1.16;
      font-weight: 700;
      letter-spacing: -.025em;
    }
    .cover-chat {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      margin-top: 48px;
    }
    .cover-chat div {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      padding: 24px;
      border-radius: 30px;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 900;
    }
    .cover-chat .question { color: var(--ink); background: var(--amber); }
    .cover-chat .answer { color: var(--primary-dark); background: #fff; transform: translateY(24px); }
    .cover-chat .question::after,
    .cover-chat .answer::after {
      content: "";
      position: absolute;
      bottom: -20px;
      width: 34px;
      height: 34px;
      clip-path: polygon(0 0,100% 0,50% 100%);
    }
    .cover-chat .question::after { left: 42px; background: var(--amber); }
    .cover-chat .answer::after { right: 42px; background: #fff; }
    .cover-swipe {
      position: absolute;
      left: 50%;
      bottom: 52px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(32,35,43,.58);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .cover-swipe b { color: var(--primary); font-size: 24px; }
  </style>
</head>
<body>
  <main class="canvas faq-canvas">
    <div class="glow red"></div><div class="glow amber"></div>
    <div class="composition composition--center">
      <header class="topbar"><img class="gs-logo" src="../../../../shared/assets/gs-logo-colour.svg" alt="Global Sources Indonesia"></header>
      <section class="content">
        <div class="cover-panel">
          <div class="cover-label">Frequently Asked Question</div>
          <h1 class="cover-title">FA<span>Q</span></h1>
          <p class="cover-subtitle">Seputar Global Sources Indonesia</p>
          <div class="cover-chat">
            <div class="question">Punya pertanyaan?</div>
            <div class="answer">Kami jawab di sini.</div>
          </div>
        </div>
      </section>
    </div>
    <div class="cover-swipe"><b>→</b> Geser untuk lengkapnya</div>

  </main>
</body>
</html>
