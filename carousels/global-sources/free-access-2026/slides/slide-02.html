<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>Akses Gratis — White Background Option</title>
  <link rel="stylesheet" href="../../../../shared/styles/system.css">
  <style>
    .white-promo {
      background:
        linear-gradient(rgba(255,255,255,.72), rgba(255,255,255,.80)),
        url("../../../../shared/assets/paper-texture.jpg") center / cover no-repeat,
        #fff;
    }

    .white-promo::after {
      content: "";
      position: absolute;
      right: -205px;
      top: 275px;
      width: 570px;
      height: 570px;
      border: 86px solid rgba(49,143,240,.055);
      border-radius: 50%;
      z-index: -1;
      opacity: .55;
    }

    .white-promo .composition {
      inset: 0;
      justify-content: flex-start;
      padding: 58px 72px 52px;
      z-index: 2;
    }

    .globe-object {
      position: absolute;
      left: 50%;
      bottom: -350px;
      z-index: 1;
      width: 780px;
      height: auto;
      transform: translateX(-50%);
      mix-blend-mode: multiply;
      filter: drop-shadow(0 -16px 24px rgba(23,109,199,.12));
      pointer-events: none;
    }

    .white-promo .topbar {
      width: 100%;
      margin: 0;
      justify-content: center;
    }

    .white-promo .gs-logo {
      width: 790px;
      height: 132px;
      object-position: center;
    }

    .white-promo .content {
      width: 100%;
      margin: 25px 0 0;
      text-align: center;
    }

    .event-meta {
      display: flex;
      justify-content: center;
      gap: 13px;
    }

    .event-meta span {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 18px;
      border-radius: 999px;
      color: var(--primary-dark);
      background: #eef6ff;
      border: 1px solid rgba(49,143,240,.28);
      font-size: 20px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -.01em;
    }

    .event-meta svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--amber);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hero {
      display: flex;
      justify-content: center;
      margin-top: 31px;
    }

    .hero h1 {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      margin: 0;
      color: var(--primary-dark);
      font-size: 86px;
      line-height: .92;
      font-weight: 900;
      letter-spacing: -.055em;
      text-transform: uppercase;
    }

    .hero h1 span:last-child {
      display: inline-block;
      padding: 12px 25px 16px;
      border-radius: 18px;
      color: var(--ink);
      background: var(--amber);
      box-shadow: 0 14px 32px rgba(49,143,240,.14);
      transform: rotate(-1deg);
    }

    .audience-card {
      margin-top: 35px;
      padding: 29px 31px 27px;
      border-radius: 30px;
      color: var(--ink);
      background: linear-gradient(145deg, #f8fbff, #edf6ff);
      border: 1px solid rgba(49,143,240,.25);
      box-shadow: 0 20px 48px rgba(30,72,125,.12);
    }

    .audience-card h2 {
      margin: 0 0 19px;
      color: var(--primary-dark);
      font-size: 24px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -.025em;
      text-transform: uppercase;
    }

    .audience-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .audience-grid span {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 49px;
      padding: 9px 13px;
      border-radius: 14px;
      color: #253049;
      background: #fff;
      border: 1px solid rgba(49,143,240,.21);
      font-size: 18px;
      line-height: 1.14;
      font-weight: 700;
    }

    .audience-grid span:last-child {
      grid-column: 2 / 4;
    }

    .category-line {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.2;
      font-weight: 700;
    }

    .cta-panel {
      display: grid;
      grid-template-columns: 1fr 188px;
      gap: 28px;
      align-items: center;
      margin-top: 31px;
      padding: 26px 25px 26px 32px;
      border-radius: 30px;
      text-align: left;
      color: #fff;
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      border: 1px solid rgba(23,109,199,.34);
      box-shadow: 0 22px 52px rgba(23,109,199,.23);
    }

    .cta-copy h2 {
      margin: 0;
      color: #fff;
      font-size: 49px;
      line-height: .98;
      font-weight: 900;
      letter-spacing: -.045em;
      text-transform: uppercase;
    }

    .cta-copy p {
      display: inline-block;
      margin: 16px 0 0;
      padding: 10px 15px;
      border-radius: 999px;
      color: var(--ink);
      background: var(--amber);
      font-size: 20px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.015em;
    }

    .qr-card {
      display: grid;
      place-items: center;
      width: 188px;
      height: 188px;
      padding: 14px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 14px 36px rgba(0,0,0,.18);
    }

    .qr-window {
      position: relative;
      width: 160px;
      height: 160px;
      overflow: hidden;
      background: #fff;
    }

    .qr-window img {
      position: absolute;
      left: -85px;
      top: -139px;
      width: 329px;
      height: 411px;
      max-width: none;
    }
  </style>
</head>
<body>
  <main class="canvas white-promo">
    <div class="glow red"></div>
    <div class="glow amber"></div>
    <img class="globe-object" src="../assets/globe-polos.png" alt="">
    <div class="composition composition--center">
      <header class="topbar">
        <img class="gs-logo" src="../../../../shared/assets/gs-logo-colour.svg" alt="Global Sources Electronics, Home Appliances, Gifts &amp; Home Indonesia">
      </header>

      <section class="content">
        <div class="event-meta">
          <span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>
            17 - 19 September 2026
          </span>
          <span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
            JICC, Senayan Jakarta
          </span>
        </div>

        <div class="hero">
          <h1><span>Akses</span><span>Gratis</span></h1>
        </div>

        <section class="audience-card">
          <h2>Khusus Untuk Kamu Para</h2>
          <div class="audience-grid">
            <span>Distributor</span>
            <span>Importir</span>
            <span>Retailer</span>
            <span>Brand Owner</span>
            <span>Pemilik Brand OEM/ODM</span>
          </div>
          <p class="category-line">
            <span>Electronics,</span><span>Gifts &amp; Home,</span><span>Home Appliances!</span>
          </p>
        </section>

        <section class="cta-panel">
          <div class="cta-copy">
            <h2>Daftar Sekarang!</h2>
            <p>Linktr.ee/GSI-Register2026</p>
          </div>
          <div class="qr-card">
            <div class="qr-window">
              <img src="../../faq-2026/assets/qr-linktree.png" alt="QR code">
            </div>
          </div>
        </section>
      </section>
    </div>
  </main>
</body>
</html>
