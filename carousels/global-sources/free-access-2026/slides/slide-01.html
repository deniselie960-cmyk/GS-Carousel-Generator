<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>Akses Gratis — Global Sources Indonesia 2026</title>
  <link rel="stylesheet" href="../../../../shared/styles/system.css">
  <style>
    .promo-canvas {
      --composition-footer-space: 0px;
      background:
        linear-gradient(145deg, rgba(23,109,199,.96), rgba(12,61,124,.98)),
        url("../../../../shared/assets/paper-texture.jpg") center / cover no-repeat,
        var(--primary-dark);
    }

    .promo-canvas::after {
      content: "";
      position: absolute;
      right: -132px;
      top: 304px;
      width: 590px;
      height: 590px;
      border: 92px solid rgba(255,255,255,.045);
      border-radius: 50%;
      z-index: -1;
    }

    .promo-canvas .composition {
      inset: 0;
      justify-content: center;
      padding: 36px 72px 54px;
    }

    .promo-canvas .topbar {
      width: 100%;
      margin: 0;
      justify-content: center;
    }

    .promo-canvas .gs-logo {
      width: 790px;
      height: 132px;
      object-position: center;
    }

    .promo-canvas .content {
      width: 100%;
      margin: 22px 0 0;
      text-align: center;
    }

    .event-meta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      color: #fff;
      font-size: 20px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -.01em;
    }

    .event-meta span {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 18px;
      border: 1px solid rgba(255,255,255,.26);
      border-radius: 999px;
      background: rgba(255,255,255,.09);
    }

    .event-meta svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--amber);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hero {
      margin-top: 31px;
    }

    .hero h1 {
      display: inline-block;
      margin: 0;
      padding: 13px 29px 17px;
      border-radius: 19px;
      color: var(--ink);
      background: var(--amber);
      box-shadow: 0 18px 42px rgba(6,33,73,.25);
      font-size: 89px;
      line-height: .92;
      font-weight: 900;
      letter-spacing: -.055em;
      text-transform: uppercase;
      transform: rotate(-1deg);
    }

    .audience-card {
      width: 100%;
      margin-top: 30px;
      padding: 26px 31px 25px;
      border: 1px solid rgba(255,255,255,.40);
      border-radius: 30px;
      color: var(--ink);
      background: rgba(255,255,255,.96);
      box-shadow: 0 20px 48px rgba(7,35,76,.23);
    }

    .audience-card h2 {
      margin: 0 0 18px;
      color: var(--primary-dark);
      font-size: 24px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -.025em;
      text-transform: uppercase;
    }

    .audience-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .audience-grid span {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 9px 13px;
      border-radius: 14px;
      color: #253049;
      background: #eef5fd;
      border: 1px solid rgba(49,143,240,.18);
      font-size: 18px;
      line-height: 1.14;
      font-weight: 700;
    }

    .audience-grid span:last-child {
      grid-column: 2 / 4;
    }

    .category-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.2;
      font-weight: 700;
    }

    .category-line i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--amber);
    }

    .cta-panel {
      display: grid;
      grid-template-columns: 1fr 188px;
      gap: 26px;
      align-items: center;
      margin-top: 28px;
      padding: 24px 25px 24px 31px;
      border-radius: 30px;
      text-align: left;
      color: #fff;
      background: rgba(8,46,101,.60);
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: inset 0 1px rgba(255,255,255,.09);
    }

    .cta-copy h2 {
      margin: 0;
      color: #fff;
      font-size: 50px;
      line-height: .98;
      font-weight: 900;
      letter-spacing: -.045em;
      text-transform: uppercase;
    }

    .cta-copy p {
      display: inline-block;
      margin: 15px 0 0;
      padding: 10px 15px;
      border-radius: 999px;
      color: var(--ink);
      background: var(--amber);
      font-size: 20px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.015em;
    }

    .qr-card {
      display: grid;
      place-items: center;
      width: 188px;
      height: 188px;
      padding: 14px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 14px 36px rgba(0,0,0,.18);
    }

    .qr-window {
      position: relative;
      width: 160px;
      height: 160px;
      overflow: hidden;
      background: #fff;
    }

    .qr-window img {
      position: absolute;
      left: -85px;
      top: -139px;
      width: 329px;
      height: 411px;
      max-width: none;
    }

  </style>
</head>
<body>
  <main class="canvas canvas--blue promo-canvas">
    <div class="glow red"></div>
    <div class="glow amber"></div>
    <div class="composition composition--center">
      <header class="topbar">
        <img class="gs-logo" src="../../../../shared/assets/gs-logo-white.svg" alt="Global Sources Electronics, Home Appliances, Gifts &amp; Home Indonesia">
      </header>

      <section class="content">
        <div class="event-meta" aria-label="Waktu dan lokasi acara">
          <span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>
            17 - 19 September 2026
          </span>
          <span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
            JICC, Senayan Jakarta
          </span>
        </div>

        <div class="hero">
          <h1>Akses Gratis</h1>
        </div>

        <section class="audience-card" aria-label="Target pengunjung">
          <h2>Khusus Untuk Kamu Para</h2>
          <div class="audience-grid">
            <span>Distributor</span>
            <span>Importir</span>
            <span>Retailer</span>
            <span>Brand Owner</span>
            <span>Pemilik Brand OEM/ODM</span>
          </div>
          <p class="category-line">
            <span>Electronics,</span><span>Gifts &amp; Home,</span><span>Home Appliances!</span>
          </p>
        </section>

        <section class="cta-panel" aria-label="Pendaftaran">
          <div class="cta-copy">
            <h2>Daftar Sekarang!</h2>
            <p>Linktr.ee/GSI-Register2026</p>
          </div>
          <div class="qr-card" aria-label="QR code pendaftaran">
            <div class="qr-window">
              <img src="../../faq-2026/assets/qr-linktree.png" alt="QR code Linktree Global Sources Indonesia 2026">
            </div>
          </div>
        </section>
      </section>
    </div>
  </main>
</body>
</html>
