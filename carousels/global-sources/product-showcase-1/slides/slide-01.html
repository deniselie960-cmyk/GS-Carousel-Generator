<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>Global Sources — Kategori Paling Laku</title>
  <link rel="stylesheet" href="../../../../shared/styles/system.css">
  <style>
    .canvas {
      background: #176dc7;
    }

    .product-art {
      position: absolute;
      inset: 0;
    }

    .product-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -5;
    }

    .topbar {
      position: absolute;
      top: 38px;
      left: var(--page-x);
      right: var(--page-x);
      width: auto;
      margin: 0;
      justify-content: center;
    }

    .gs-logo {
      width: 610px;
      height: 104px;
      object-position: center;
    }

    .content {
      position: absolute;
      top: 166px;
      left: var(--page-x);
      right: var(--page-x);
      text-align: center;
    }

    .headline {
      margin: 0;
      font-size: 64px;
      line-height: 0.98;
      color: var(--white);
    }

    .headline .highlight {
      font-size: 0.90em;
      color: var(--ink);
      background: var(--amber);
      box-shadow: none;
    }

    .headline .long-line {
      font-size: 0.82em;
      white-space: nowrap;
    }

    .supporting-copy {
      width: 610px;
      margin: 26px auto 0;
    }

    .subheadline {
      margin: 0;
      color: var(--white);
      font-size: 52px;
      line-height: 0.98;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <img class="product-art" src="../assets/electronics-products-base.png" alt="Pilihan produk elektronik di atas podium biru">

    <header class="topbar">
      <img class="gs-logo" src="../../../../shared/assets/gs-logo-white.svg" alt="Global Sources Indonesia">
    </header>

    <section class="content">
      <h1 class="headline">
        <span class="highlight">Kategori paling laku</span>
        <span class="line long-line">Suppliernya paling diburu</span>
      </h1>

      <div class="supporting-copy">
        <p class="subheadline">Kamu wajib hadir</p>
      </div>
    </section>
  </main>
</body>
</html>
