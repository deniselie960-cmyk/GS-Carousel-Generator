<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>Panduan Freight Forwarder — Slide 01</title>
  <link rel="stylesheet" href="../../../../shared/styles/system.css">
  <style>
    .composition { --composition-gap: 22px; }
    .content { display: flex; flex-direction: column; align-items: flex-start; }
    .headline { margin: 0; max-width: 936px; font-size: 67px; }
    .headline .highlight { font-size: .98em; }
    .headline .question-line { font-size: .91em; white-space: nowrap; }
    .hook-copy {
      margin: 28px 0 0;
      padding-left: 22px;
      border-left: 6px solid var(--amber);
      color: var(--ink);
      font-size: 31px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -.025em;
    }
    .hook-copy strong { color: var(--primary-dark); }
    .photo-stack {
      position: relative;
      width: 100%;
      height: 390px;
      margin-top: 30px;
      isolation: isolate;
    }
    .photo-stack::before,
    .photo-stack::after {
      content: "";
      position: absolute;
      inset: 8px 13px -8px;
      z-index: -2;
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(32,35,43,.12);
      box-shadow: 0 22px 45px rgba(42,58,87,.15);
      transform: rotate(-1deg);
    }
    .photo-stack::after { inset: 4px 7px -4px; z-index: -1; transform: rotate(.65deg); }
    .hero-photo {
      position: relative;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 9px;
      overflow: hidden;
      background: var(--white);
      border: 1px solid rgba(32,35,43,.13);
      box-shadow: 0 20px 48px rgba(42,58,87,.15);
    }
    .hero-photo img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center 62%; }
    .route-tag {
      position: absolute;
      left: 31px;
      bottom: 28px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 13px 18px;
      color: var(--white);
      background: rgba(18,49,94,.88);
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 999px;
      box-shadow: 0 12px 28px rgba(9,30,66,.22);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      backdrop-filter: blur(5px);
    }
    .route-tag b { color: var(--amber); font-size: 20px; }
    .swipe {
      position: absolute;
      left: var(--page-x);
      bottom: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(32,35,43,.58);
      font-size: 14px;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .swipe svg { width: 23px; height: 23px; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="glow red"></div><div class="glow amber"></div>
    <div class="composition composition--left">
      <header class="topbar">
        <img class="gs-logo" src="../../../../shared/assets/gs-logo-colour.svg" alt="Global Sources Indonesia">
      </header>
      <section class="content">
        <h1 class="headline">
          <span class="highlight">Mau impor</span>
          <span class="line">dari Tiongkok?</span>
          <span class="line question-line">Bingung pilih forwarder?</span>
        </h1>
        <p class="hook-copy"><strong>3 hal</strong> ini wajib kamu cek dulu sebelum deal.</p>
        <div class="photo-stack">
          <figure class="hero-photo">
            <img src="../assets/cover-container.jpg" alt="Kontainer sedang dipindahkan di area logistik">
            <figcaption class="route-tag"><span>Tiongkok</span><b>→</b><span>Indonesia</span></figcaption>
          </figure>
        </div>
      </section>
    </div>
    <div class="swipe">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      Swipe ke kiri
    </div>
    <footer class="footer" style="justify-content:flex-end"><span>01 / 04</span></footer>
  </main>
</body>
</html>
