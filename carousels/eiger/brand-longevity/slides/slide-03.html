<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>EIGER Brand Longevity — Slide 03</title>
  <link rel="stylesheet" href="../../../../shared/styles/system.css">
  <style>
    .composition { --composition-gap: 22px; }
    .headline { margin: 0; max-width: 936px; font-size: 68px; }
    .headline .long-line { font-size: .84em; white-space: nowrap; }
    .intro {
      max-width: 905px;
      margin: 27px 0 0;
      color: #3b414d;
      font-size: 24px;
      line-height: 1.44;
      letter-spacing: -.015em;
    }
    .intro strong { color: var(--ink); }
    .photo-collage {
      position: relative;
      width: 100%;
      height: 450px;
      margin-top: 27px;
      isolation: isolate;
    }
    .photo-card {
      position: absolute;
      margin: 0;
      padding: 8px;
      overflow: hidden;
      background: var(--white);
      border: 1px solid rgba(32, 35, 43, .12);
      box-shadow: 0 22px 52px rgba(42, 58, 87, .18);
    }
    .photo-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .photo-card.brand-anchor {
      top: 0;
      right: 0;
      z-index: 1;
      width: 610px;
      height: 407px;
      transform: rotate(.8deg);
    }
    .photo-card.brand-anchor img { object-position: center; }
    .photo-card.store-scene {
      left: 0;
      top: 91px;
      z-index: 2;
      width: 430px;
      height: 319px;
      transform: rotate(-1.4deg);
    }
    .photo-card.store-scene img { object-position: center; }
    .message-card {
      position: absolute;
      right: 28px;
      bottom: 0;
      z-index: 4;
      width: 500px;
      padding: 22px 26px 24px;
      color: var(--white);
      background: var(--primary);
      border: 1px solid rgba(255, 255, 255, .35);
      box-shadow: 0 18px 42px rgba(23, 109, 199, .27);
    }
    .message-card small {
      display: block;
      margin-bottom: 9px;
      color: rgba(255, 255, 255, .76);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .message-card strong {
      display: block;
      font-size: 27px;
      line-height: 1.12;
      letter-spacing: -.025em;
      text-transform: uppercase;
    }
    .message-card strong span { color: var(--amber); }
    .closing {
      max-width: 880px;
      margin: 24px 0 0;
      color: #3b414d;
      font-size: 23px;
      line-height: 1.42;
      letter-spacing: -.01em;
    }
    .closing strong { color: var(--ink); }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="glow red"></div><div class="glow amber"></div>

    <div class="composition composition--left">
      <header class="topbar">
        <img class="gs-logo" src="../../../../shared/assets/gs-logo-colour.svg" alt="Global Sources Indonesia">
      </header>

      <section class="content">
        <h1 class="headline">
          <span class="highlight">Yang Dijual</span>
          <span class="line long-line">Bukan Sekadar Produk</span>
        </h1>

        <p class="intro">Gear outdoor bisa dibeli di mana saja. Tapi ketika orang butuh yang <strong>terpercaya</strong> untuk mendaki, berkemah, atau ekspedisi —</p>

        <div class="photo-collage" aria-label="Kolase pengalaman berbelanja dan identitas gerai EIGER">
          <figure class="photo-card brand-anchor">
            <img src="../assets/eiger-store-interior-front.png" alt="Bagian depan dan interior gerai EIGER Tropical Adventure">
          </figure>
          <figure class="photo-card store-scene">
            <img src="../assets/eiger-store-gear-counter.png" alt="Pelanggan dan perlengkapan outdoor di dalam gerai">
          </figure>
          <div class="message-card">
            <small>Top of mind</small>
            <strong>Nama pertama yang muncul <span>tetap Eiger.</span></strong>
          </div>
        </div>

        <p class="closing">Itu hasil dari <strong>branding yang konsisten</strong> selama puluhan tahun.</p>
      </section>
    </div>

    <footer class="footer">
      <div class="progress" aria-label="Slide 3 dari 4">
        <i></i><i></i><i class="active"></i><i></i>
      </div>
      <span>03 / 04</span>
    </footer>
  </main>
</body>
</html>
