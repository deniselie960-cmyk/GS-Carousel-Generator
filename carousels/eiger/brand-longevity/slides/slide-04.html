<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>EIGER Brand Longevity — Slide 04</title>
  <link rel="stylesheet" href="../../../../shared/styles/system.css">
  <style>
    .composition { --composition-gap: 22px; }
    .glow.red {
      right: -245px;
      top: 160px;
      background: radial-gradient(circle, rgba(117, 190, 255, .24), transparent 68%);
    }
    .glow.amber { opacity: .72; }
    .headline { margin: 0; font-size: 66px; }
    .headline .highlight { font-size: .92em; }
    .intro {
      max-width: 850px;
      margin: 28px auto 0;
      color: rgba(255, 255, 255, .82);
      font-size: 24px;
      line-height: 1.46;
      letter-spacing: -.015em;
    }
    .intro strong { color: var(--white); }
    .contrast-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 25px;
    }
    .copyable {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      padding: 12px 17px;
      border-radius: 999px;
      color: rgba(255, 255, 255, .68);
      background: rgba(8, 42, 89, .24);
      border: 1px solid rgba(255, 255, 255, .17);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .copyable b { color: var(--white); }
    .copyable span { color: rgba(255, 255, 255, .40); }
    .brand-moat {
      position: relative;
      width: 850px;
      height: 470px;
      margin: 22px auto 0;
    }
    .brand-moat svg { width: 100%; height: 100%; display: block; }
    .brand-core {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      width: 184px;
      height: 184px;
      border-radius: 50%;
      color: var(--ink);
      background: var(--amber);
      border: 9px solid rgba(255, 255, 255, .22);
      box-shadow: 0 0 0 18px rgba(243, 181, 27, .10), 0 24px 55px rgba(8, 37, 79, .30);
    }
    .brand-core span {
      font-size: 29px;
      line-height: .95;
      font-weight: 900;
      letter-spacing: -.03em;
      text-transform: uppercase;
    }
    .moat-card {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 205px;
      padding: 15px 18px;
      border-radius: 18px;
      color: var(--white);
      background: rgba(255, 255, 255, .11);
      border: 1px solid rgba(255, 255, 255, .25);
      box-shadow: 0 16px 34px rgba(8, 37, 79, .18);
      backdrop-filter: blur(4px);
    }
    .moat-card .icon-box {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 13px;
      color: var(--amber);
      background: rgba(8, 42, 89, .28);
      border: 1px solid rgba(255, 255, 255, .15);
    }
    .moat-card svg { width: 24px; height: 24px; }
    .moat-card strong {
      font-size: 16px;
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    .moat-card.community { left: 4px; top: 68px; }
    .moat-card.trust { right: 2px; top: 68px; }
    .moat-card.identity { left: 50%; bottom: 26px; transform: translateX(-50%); }
    .conclusion {
      display: inline-block;
      margin: 5px auto 0;
      padding-bottom: 8px;
      color: var(--white);
      border-bottom: 5px solid var(--amber);
      font-size: 31px;
      line-height: 1.18;
      font-weight: 900;
      letter-spacing: -.025em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="canvas canvas--blue">
    <div class="glow red"></div><div class="glow amber"></div>

    <div class="composition composition--center">
      <header class="topbar">
        <img class="gs-logo" src="../../../../shared/assets/gs-logo-white.png" alt="Global Sources Indonesia">
      </header>

      <section class="content">
        <h1 class="headline">
          <span class="highlight">Pelajaran dari Eiger</span>
        </h1>

        <p class="intro">Produk bisa ditiru kompetitor. Harga bisa bersaing. Tapi brand yang punya <strong>komunitas, kepercayaan, dan identitas yang kuat</strong> —</p>

        <div class="contrast-row" aria-label="Hal yang mudah ditiru atau disaingi">
          <span class="copyable"><b>Produk</b><span>→</span>bisa ditiru</span>
          <span class="copyable"><b>Harga</b><span>→</span>bisa bersaing</span>
        </div>

        <div class="brand-moat" aria-label="Komunitas, kepercayaan, dan identitas membentuk kekuatan brand">
          <svg viewBox="0 0 850 470" preserveAspectRatio="none" aria-hidden="true">
            <ellipse cx="425" cy="235" rx="310" ry="180" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="2" stroke-dasharray="8 10"/>
            <ellipse cx="425" cy="235" rx="236" ry="135" fill="none" stroke="rgba(243,181,27,.62)" stroke-width="2" stroke-dasharray="7 9"/>
            <path d="M205 116C278 149 319 180 347 205" fill="none" stroke="rgba(255,255,255,.26)" stroke-width="2"/>
            <path d="M645 116C572 149 531 180 503 205" fill="none" stroke="rgba(255,255,255,.26)" stroke-width="2"/>
            <path d="M425 398V332" fill="none" stroke="rgba(255,255,255,.26)" stroke-width="2"/>
          </svg>

          <div class="brand-core"><span>Brand<br>Kuat</span></div>

          <div class="moat-card community">
            <span class="icon-box">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </span>
            <strong>Komunitas</strong>
          </div>

          <div class="moat-card trust">
            <span class="icon-box">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 7 3v5c0 5-3.2 8.4-7 10-3.8-1.6-7-5-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
            </span>
            <strong>Kepercayaan</strong>
          </div>

          <div class="moat-card identity">
            <span class="icon-box">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5M3 17l9 5 9-5"/></svg>
            </span>
            <strong>Identitas</strong>
          </div>
        </div>

        <p class="conclusion">Itu yang tidak bisa dicopy.</p>
      </section>
    </div>

    <footer class="footer">
      <div class="progress" aria-label="Slide 4 dari 4">
        <i></i><i></i><i></i><i class="active"></i>
      </div>
      <span>04 / 04</span>
    </footer>
  </main>
</body>
</html>
